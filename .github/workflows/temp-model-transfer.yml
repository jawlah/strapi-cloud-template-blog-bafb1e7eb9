name: Temporary model transfer

on:
  push:
    branches:
      - temp-transcription-model
    paths:
      - .github/workflows/temp-model-transfer.yml

permissions:
  contents: write

jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: temp-transcription-model
      - name: Download compact multilingual Whisper model
        run: |
          curl -L --fail --retry 3 -o tmp-whisper-model.txt "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny-q5_1.bin?download=true"
          test "$(stat -c%s tmp-whisper-model.txt)" -eq 32152673
          echo "818710568da3ca15689e31a743197b520007872ff9576237bda97bd1b469c3d7  tmp-whisper-model.txt" | sha256sum -c -
      - name: Commit temporary model carrier
        run: |
          git config user.name "temporary-transcription-transfer"
          git config user.email "actions@users.noreply.github.com"
          git add tmp-whisper-model.txt
          git commit -m "Temporary transcription model carrier"
          git push origin HEAD:temp-transcription-model
